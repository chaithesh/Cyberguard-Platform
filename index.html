<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberGuard - Security & Risk Detection</title>
  <meta name="description" content="Simple, intelligent multi-vector phishing, scam, and risk detection platform.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Chart.js for Clean Visual Charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body class="clean-theme">

  <!-- App Wrapper -->
  <div id="app" class="app-container">
    
    <!-- Clean Minimal Navigation Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="brand-logo">
          <div class="shield-icon-wrap">
            <i data-lucide="shield-check" class="brand-icon"></i>
          </div>
          <div class="brand-text">
            <span class="brand-name">CYBER<span class="highlight">GUARD</span></span>
            <span class="brand-tag">Threat &amp; Risk Scanner</span>
          </div>
        </div>
      </div>

      <!-- Main Clean Navigation Tabs -->
      <nav class="app-nav">
        <button class="nav-btn active" data-tab="risk-scores" id="nav-risk-scores">
          <i data-lucide="bar-chart-3"></i>
          <span>Risk Scores</span>
        </button>
        <button class="nav-btn" data-tab="url-scanner" id="nav-url-scanner">
          <i data-lucide="globe"></i>
          <span>URL</span>
        </button>
        <button class="nav-btn" data-tab="email-scanner" id="nav-email-scanner">
          <i data-lucide="mail"></i>
          <span>Email</span>
        </button>
        <button class="nav-btn" data-tab="smishing-scanner" id="nav-smishing-scanner">
          <i data-lucide="message-square"></i>
          <span>SMS</span>
        </button>
        <button class="nav-btn" data-tab="vishing-scanner" id="nav-vishing-scanner">
          <i data-lucide="phone-call"></i>
          <span>Fraud Call</span>
        </button>
        <button class="nav-btn" data-tab="image-scanner" id="nav-image-scanner">
          <i data-lucide="qr-code"></i>
          <span>QR &amp; Image</span>
        </button>
        <button class="nav-btn" data-tab="adversarial-lab" id="nav-adversarial-lab">
          <i data-lucide="brain"></i>
          <span>Explainable Lab</span>
        </button>
      </nav>

      <div class="header-right">
        <div class="status-indicator online">
          <span class="status-dot"></span>
          <span class="status-text">Engine Ready</span>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="app-main" id="mainContent">
      <!-- Dynamic Views rendered via JS -->
    </main>

    <!-- Clean Minimal Footer -->
    <footer class="app-footer">
      <div class="footer-info">
        <span>CyberGuard &bull; AI-Powered Risk &amp; Phishing Detection</span>
      </div>
      <div class="footer-stats">
        <span id="scannedCountBadge"><i data-lucide="activity"></i> Scans: <strong>0</strong></span>
        <span class="privacy-badge"><i data-lucide="lock"></i> 100% Private (Local Edge Analysis)</span>
      </div>
    </footer>
  </div>

  <!-- Application Scripts -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
